services:
  - type: web
    name: ledgerline-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /api/health
    disk:
      name: ledgerline-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: LEDGERLINE_DB
        value: /var/data/ledgerline.db
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_ALERT_TO
        value: rsha230121@gmail.com
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
